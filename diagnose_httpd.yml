---
# Read-only check of httpd. Does not change config or restart the service.
- name: Diagnose Satellite httpd
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Check whether httpd is active
      ansible.builtin.command: systemctl is-active httpd
      register: httpd_active
      changed_when: false
      failed_when: false

    - name: Run httpd config test
      ansible.builtin.command: httpd -t
      register: httpd_configtest
      changed_when: false
      failed_when: false

    - name: Read the last httpd error log lines
      ansible.builtin.command: tail -n 40 /var/log/httpd/error_log
      register: httpd_error_log
      changed_when: false
      failed_when: false

    - name: Report httpd diagnosis
      ansible.builtin.debug:
        msg:
          - "httpd is-active: {{ httpd_active.stdout }}"
          - "httpd -t rc: {{ httpd_configtest.rc }}"
          - "{{ httpd_configtest.stderr | default(httpd_configtest.stdout, true) }}"
          - "error_log:"
          - "{{ httpd_error_log.stdout | default(httpd_error_log.stderr, true) }}"
